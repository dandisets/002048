description: Light-sheet microscopy macaque and human data.  The Dandiset contains
  the raw image volume and binary axon/background ground-truth label for each of the
  12 annotated patches. Two patches were used for threshold calibration and 10 for
  held-out evaluation. The patches come from one human sample (NEFH and NEFL immunolabeling)
  and one macaque sample (NEFH and PV immunolabeling), and they span gray matter,
  white matter, and white–gray transition regions.
